[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
fervor-domain = { path = "crates/fervor-domain" }
fervor-guest-abi = { path = "crates/fervor-guest-abi" }
fervor-conda = { path = "crates/fervor-conda" }
fervor-layerfs = { path = "crates/fervor-layerfs" }
fervor-store = { path = "crates/fervor-store" }
fervor-vmm = { path = "crates/fervor-vmm" }
fervor-app = { path = "crates/fervor-app" }

# rattler (versions are released in lock-step; keep them aligned)
rattler = { version = "=0.51.0", default-features = false, features = ["rustls"] }
rattler_conda_types = "=0.55.0"
rattler_digest = { version = "=2.0.0", features = ["serde"] }
rattler_networking = { version = "=0.31.0", default-features = false, features = ["rustls"] }
rattler_package_streaming = { version = "=0.27.8", default-features = false, features = ["rustls", "reqwest"] }
rattler_repodata_gateway = { version = "=0.34.0", default-features = false, features = ["rustls", "gateway"] }
rattler_solve = { version = "=10.0.1", default-features = false, features = ["resolvo"] }
rattler_virtual_packages = "=8.0.0"

backhand = { version = "=0.25.5", default-features = false, features = ["zstd"] }
camino = { version = "1.2", features = ["serde1"] }
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
hex = "0.4"
miette = { version = "7.6", features = ["fancy"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
# rattler's networking stack uses astral's fork; the crates.io crate's types are incompatible.
reqwest-middleware = { package = "astral-reqwest-middleware", version = "0.5" }
rustix = { version = "1.1", features = ["fs", "mount", "process", "system", "net", "event", "termios"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "process", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.5", features = ["serde"] }

[profile.release]
strip = true
