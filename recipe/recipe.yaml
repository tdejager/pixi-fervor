package:
  name: pixi-fervor
  version: 0.1.0

source:
  path: ..

build:
  number: 0
  script:
    content:
      - cargo zigbuild --locked --release --target aarch64-unknown-linux-gnu.2.28 -p fervor-init -p fervor-runner
      # Linux binaries embedded into pixi-fervor (see crates/pixi-fervor/build.rs).
      - export FERVOR_INIT_BIN="$SRC_DIR/target/aarch64-unknown-linux-gnu/release/fervor-init"
      - export FERVOR_RUNNER_BIN="$SRC_DIR/target/aarch64-unknown-linux-gnu/release/fervor-runner"
      - cargo build --locked --release -p pixi-fervor
      - mkdir -p "$PREFIX/bin"
      - install -m 755 target/release/pixi-fervor "$PREFIX/bin/pixi-fervor"

requirements:
  build:
    - rust >=1.98.1,<1.99
    - cargo-zigbuild >=0.23.4,<0.24
    - zig >=0.16.0,<0.17
    - if: osx
      then: rust-std-aarch64-unknown-linux-gnu >=1.98.1,<1.99

tests:
  - script:
      - pixi-fervor --help

about:
  summary: "pixi extension: build and run Firecracker microVM images from conda environments"
  license: BSD-3-Clause
  repository: https://github.com/tdejager/pixi-fervor
